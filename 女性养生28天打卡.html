<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff6b35">
<title>女性养生 28 天打卡</title>
<style>
:root{
  --primary:#ff6b35;
  --primary-dark:#e8551f;
  --primary-light:#fff3ee;
  --accent:#d97706;
  --bg:#f7f5f2;
  --card:#ffffff;
  --text:#1f2937;
  --text-2:#6b7280;
  --text-3:#9ca3af;
  --border:#e5e7eb;
  --danger:#dc2626;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  padding-bottom:40px;
}

/* 顶部导航 */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--card);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}
.topbar-inner{max-width:640px;margin:0 auto;padding:10px 16px 0}
.brand{font-size:1.05rem;font-weight:700;color:var(--primary);letter-spacing:.5px;margin-bottom:8px}
.tabs{display:flex;gap:4px}
.tab{
  flex:1;padding:9px 0 10px;border:none;background:none;
  font-size:.92rem;color:var(--text-2);cursor:pointer;
  border-bottom:2.5px solid transparent;font-weight:500;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

main{max-width:640px;margin:0 auto;padding:14px 16px}
.page{display:none}
.page.active{display:block}

/* 卡片 */
.card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-title .sub{font-size:.78rem;color:var(--text-3);font-weight:400}

/* 日期切换条 */
.date-nav{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:6px 8px;box-shadow:var(--shadow);
}
.nav-arrow{
  height:40px;padding:0 12px;border:none;border-radius:8px;background:var(--primary-light);
  color:var(--primary);font-size:.85rem;font-weight:600;cursor:pointer;flex-shrink:0;
}
.nav-arrow:disabled{background:var(--bg);color:var(--text-3);cursor:default}
.nav-label{flex:1;text-align:center;font-size:.92rem;font-weight:600;min-width:0}
.nav-hint{font-size:.72rem;color:var(--text-3);font-weight:400;margin-top:2px}
.today-badge{font-size:.68rem;background:var(--primary);color:#fff;border-radius:4px;padding:1px 6px;font-weight:500}
.draft-badge{font-size:.68rem;background:#fffbeb;color:var(--accent);border:1px solid #fde68a;border-radius:4px;padding:1px 6px;font-weight:500}
.back-today{display:inline-block;margin-top:4px;font-size:.78rem;color:var(--primary);text-decoration:underline}

.draft-badge.ok{background:var(--primary-light);color:var(--primary);border-color:#ffd9c7}

/* 双按钮行 */
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;width:auto}

/* 只读态 */
.check-row.locked .box{cursor:default;opacity:.85}
.field input:disabled,.field select:disabled,.field textarea:disabled{
  background:var(--bg);color:var(--text);opacity:.9;
}

/* 今日头部 */
.day-hero{
  background:linear-gradient(135deg,#ff6b35 0%,#ff9166 100%);
  color:#fff;border-radius:var(--radius);padding:18px 16px;margin-bottom:12px;
}
.day-hero .day-num{font-size:.8rem;opacity:.85}
.day-hero .day-focus{font-size:1.08rem;font-weight:600;margin:6px 0 4px;line-height:1.4}
.day-hero .day-walk{font-size:.82rem;opacity:.9}
.day-hero .day-date{font-size:.78rem;opacity:.75;margin-top:8px}
.hero-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
.hero-stats-2 .hero-stat{flex:1}
.hero-stat .v{font-size:1.15rem;font-weight:700}
.hero-stat .k{font-size:.72rem;opacity:.85}

/* 打卡项 */
.check-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--border);
}
.check-row:last-child{border-bottom:none}
.check-row .box{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.check-row .box.on{background:var(--primary);border-color:var(--primary);color:#fff;font-size:.85rem}
.check-row .label{flex:1;font-size:.9rem}
.check-row .hint{font-size:.75rem;color:var(--text-3)}

/* 输入 */
.field{margin-bottom:12px}
.field label{display:block;font-size:.82rem;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  font-size:.92rem;font-family:inherit;background:#fff;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.field textarea{resize:vertical;min-height:52px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1;min-width:0}
.input-suffix{position:relative}
.input-suffix input{padding-right:44px}
.input-suffix .suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--text-3)}

/* 按钮 */
.btn{
  display:block;width:100%;padding:12px;border:none;border-radius:10px;
  background:var(--primary);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;
}
.btn:active{background:var(--primary-dark)}
.btn.secondary{background:var(--primary-light);color:var(--primary)}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-weight:500}
.btn.small{width:auto;padding:7px 14px;font-size:.82rem;display:inline-block}
.btn.danger{background:none;color:var(--danger);border:1px solid #fecaca}

/* 计划列表 */
.plan-item{
  display:flex;gap:12px;padding:13px 14px;background:var(--card);
  border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);
  box-shadow:var(--shadow);align-items:flex-start;
}
.plan-item .d{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;background:var(--bg);color:var(--text-2);
}
.plan-item.done .d{background:var(--primary);color:#fff}
.plan-item.today .d{background:var(--accent);color:#fff}
.plan-item.review .d{border:2px dashed var(--accent);background:#fffbeb;color:var(--accent)}
.plan-item.editable{cursor:pointer}
.plan-item.editable:active{background:var(--primary-light)}
.plan-item .info{flex:1;min-width:0}
.plan-item .focus{font-size:.88rem;font-weight:500;line-height:1.4}
.plan-item .meta{font-size:.75rem;color:var(--text-3);margin-top:3px}
.plan-item .meta .walk{color:var(--primary)}
.week-sep{font-size:.78rem;color:var(--text-2);font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.week-sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* 趋势 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-cell .v{font-size:1.2rem;font-weight:700;color:var(--primary)}
.stat-cell .v.warn{color:var(--accent)}
.stat-cell .k{font-size:.72rem;color:var(--text-2);margin-top:2px}
canvas.chart{width:100%;height:180px;display:block}
.chart-note{font-size:.75rem;color:var(--text-3);text-align:center;margin-top:6px}
.legend{display:flex;gap:14px;justify-content:center;font-size:.75rem;color:var(--text-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 周复盘条 */
.week-bar{display:flex;gap:4px;margin-top:8px}
.week-bar .seg{flex:1;height:8px;border-radius:4px;background:var(--border)}
.week-bar .seg.on{background:var(--primary)}

/* 血糖记录条目 */
.glucose-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;
  background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:.85rem;
}
.glucose-item .val{font-weight:700;color:var(--primary)}
.glucose-item .tag{font-size:.72rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text-2)}
.glucose-item .del{margin-left:auto;color:var(--text-3);border:none;background:none;font-size:1rem;cursor:pointer;padding:0 4px}

/* 提示类 */
.notice{font-size:.78rem;color:var(--text-2);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;line-height:1.6}
.notice.red{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.empty{text-align:center;color:var(--text-3);font-size:.85rem;padding:28px 0}

.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);
  background:rgba(31,41,55,.92);color:#fff;padding:10px 20px;border-radius:24px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 设置列表 */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid var(--border);font-size:.9rem;
}
.setting-row:last-child{border-bottom:none}
.setting-row .desc{font-size:.75rem;color:var(--text-3);margin-top:2px}

@media (min-width:641px){
  html{font-size:16px}
}

/* ===== v2 新增 ===== */
/* 顶部提示条（可关闭） */
.banner{
  display:flex;align-items:flex-start;gap:8px;font-size:.78rem;color:var(--text-2);
  background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.6;
}
.banner-txt{flex:1}
.banner-x{border:none;background:none;color:var(--text-3);font-size:.95rem;cursor:pointer;padding:0 2px;line-height:1}

.hero-stats-2{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
.hero-sub{font-size:.72rem;opacity:.8;margin-top:8px}

/* 模式切换 */
.mode-switch{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);
}
.mode-label{font-size:.85rem;color:var(--text-2);font-weight:500}
.seg-switch{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:3px}
.seg-btn{
  border:none;background:none;padding:7px 14px;border-radius:6px;
  font-size:.82rem;font-weight:500;color:var(--text-2);cursor:pointer;font-family:inherit;
}
.seg-btn.on{background:var(--primary);color:#fff;font-weight:600}
.seg-btn:disabled{opacity:.55;cursor:default}

/* 三态勾选框 */
.check-row .box.off{background:#f3f4f6;border-color:#d1d5db;color:var(--text-3);font-size:.8rem}
.check-row .box.skip{background:none;border-style:dashed;border-color:var(--primary);color:var(--primary);font-size:.8rem}
.tri-hint{font-size:.7rem;color:var(--text-3);margin-top:4px}
.link-btn{
  border:none;background:none;color:var(--primary);font-size:.72rem;
  text-decoration:underline;cursor:pointer;padding:0;margin-top:4px;font-family:inherit;
}

/* 数值型行动行 */
.num-row{padding:11px 0;border-bottom:1px solid var(--border)}
.num-row:last-child{border-bottom:none}
.num-row.locked{opacity:.9}
.num-head{display:flex;align-items:center;gap:10px}
.num-label{flex:1;min-width:0;font-size:.9rem}
.num-input{position:relative;width:132px;flex-shrink:0}
.num-input input{
  width:100%;padding:8px 40px 8px 10px;border:1px solid var(--border);border-radius:8px;
  font-size:.9rem;font-family:inherit;
}
.num-input .unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--text-3)}
.num-state{font-size:.72rem;color:var(--text-3);margin-top:4px}
.num-state.ok{color:var(--primary);font-weight:600}

/* 快捷按钮 */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{
  border:1px solid #ffd9c7;background:var(--primary-light);color:var(--primary);
  border-radius:14px;padding:5px 11px;font-size:.75rem;font-weight:500;cursor:pointer;font-family:inherit;
}
.chip:active{background:#ffe3d6}
.chip.undo{border-color:var(--border);background:#fff;color:var(--text-2)}
.chip:disabled{opacity:.45;cursor:default}

/* 折叠区 */
details.fold{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
details.fold>summary{
  cursor:pointer;padding:14px 16px;font-size:.95rem;font-weight:600;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';color:var(--text-3);font-size:.85rem;font-weight:400;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold>summary .fold-sub{font-size:.75rem;color:var(--text-3);font-weight:400;margin-left:auto}
details.fold>*:not(summary){margin-left:16px;margin-right:16px}
details.fold>*:not(summary):last-child{margin-bottom:16px}
details.fold.card{padding:0}
details.fold .fold{background:var(--bg);box-shadow:none;margin-top:4px}
details.fold .fold>summary{padding:10px 12px;font-size:.85rem}

/* 查看方法 */
details.tips{margin-top:6px;background:none;border:none;box-shadow:none}
details.tips>summary{font-size:.75rem;color:var(--primary);cursor:pointer;list-style:none;text-decoration:underline}
details.tips>summary::-webkit-details-marker{display:none}
.tip-body{
  font-size:.78rem;color:var(--text-2);background:var(--bg);border-radius:8px;
  padding:10px 12px;margin-top:6px;line-height:1.75;
}
.tip-body b{color:var(--text)}
.tip-sub{font-size:.75rem;font-weight:600;color:var(--text);margin:8px 0 2px}

/* 血糖分组 */
.g-group{font-size:.75rem;font-weight:600;color:var(--text-2);margin:10px 0 6px}
.g-list{margin-top:8px}
.tag.warn{border-color:#fde68a;background:#fffbeb;color:var(--accent)}

/* 称重突出 */
.weigh-box{
  background:var(--primary-light);border:1px solid #ffd9c7;border-radius:10px;
  padding:12px;margin-top:10px;
}
.weigh-title{font-size:.82rem;font-weight:600;color:var(--primary);margin-bottom:8px}

/* 今日数值汇总 */
.num-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ns-item{
  flex:1;min-width:86px;background:var(--bg);border-radius:8px;padding:8px 10px;
  font-size:.72rem;color:var(--text-3);
}
.ns-item b{display:block;font-size:.85rem;color:var(--text-2);margin-top:2px}
.ns-item.ok b{color:var(--primary)}

/* 保存状态区 */
.save-area{margin-top:4px}
.save-status{
  text-align:center;font-size:.78rem;color:var(--text-3);margin-bottom:9px;font-weight:500;
}
.save-status.saved{color:var(--primary)}
.save-status.ok{color:var(--primary);font-weight:600}
.save-status.failed{color:var(--danger);font-weight:600}

/* 只读数值输入 */
.num-input input:disabled{background:var(--bg);color:var(--text);opacity:.9}

/* 计划页状态 */
.plan-state{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip-state{font-size:.68rem;border-radius:4px;padding:1px 7px;font-weight:500;border:1px solid var(--border);color:var(--text-2);background:#fff}
.chip-state.s-done{background:var(--primary-light);border-color:#ffd9c7;color:var(--primary)}
.chip-state.s-draft{background:#fffbeb;border-color:#fde68a;color:var(--accent)}
.chip-state.s-future{background:var(--bg);color:var(--text-3)}
.chip-state.s-todo{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.chip-time{font-size:.68rem;color:var(--text-3)}

/* 趋势周块 */
.week-block{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.week-block:first-child{border-top:none;margin-top:0;padding-top:0}
.week-head{font-size:.85rem;margin-bottom:8px}
.week-head span{color:var(--text-3);font-weight:400;font-size:.75rem;margin-left:4px}
.week-days{display:flex;gap:4px;margin-bottom:8px}
.wday{
  flex:1;text-align:center;border-radius:6px;padding:6px 2px;font-size:.68rem;
  background:var(--bg);color:var(--text-3);border:1px solid transparent;
}
.wday span{display:block;font-weight:700;font-size:.78rem}
.wday i{font-style:normal;font-size:.62rem}
.wday.done{background:var(--primary);color:#fff}
.wday.draft{background:var(--primary-light);color:var(--primary);border-color:#ffd9c7}
.wday.empty{background:var(--bg);color:var(--text-3);border-style:dashed;border-color:var(--border)}
.week-metrics{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.wm{flex:1;min-width:96px;background:var(--bg);border-radius:8px;padding:7px 9px}
.wm b{display:block;font-size:.85rem;color:var(--text)}
.wm span{font-size:.68rem;color:var(--text-3)}
.mode-cols{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mode-col{flex:1;min-width:150px;border:1px solid var(--border);border-radius:8px;padding:9px 10px}
.mode-col-title{font-size:.78rem;font-weight:600;margin-bottom:6px}
.mode-col-title span{color:var(--text-3);font-weight:400;font-size:.68rem}
.mode-empty{font-size:.72rem;color:var(--text-3)}
.ms-row{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.ms-row:last-child{border-bottom:none}
.ms-name{color:var(--text-2);flex-shrink:0}
.ms-val{color:var(--text-3);text-align:right}
.ms-val.num{color:var(--primary)}
.week-adjust{margin-top:10px;margin-bottom:0}
.stat-cell .k2{font-size:.65rem;color:var(--text-3);margin-top:2px}

/* 设置页基线块 */
.base-block{border-bottom:1px dashed var(--border);padding-bottom:12px;margin-bottom:12px}
.base-block:last-of-type{border-bottom:none}
.base-name{font-size:.85rem;font-weight:600;margin-bottom:8px}
.base-cur{font-size:.72rem;color:var(--text-3);margin-top:-4px}
.base-block .field{margin-bottom:10px}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:#fff;border-radius:14px;padding:18px;width:100%;max-width:400px;
  max-height:86vh;overflow:auto;
}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:12px}
.modal-body{font-size:.82rem;color:var(--text-2);line-height:1.75}
.modal-line{margin-bottom:6px}
.modal-line b{color:var(--text)}
.modal-note{font-size:.75rem;color:var(--text-3);background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.modal-btns .btn{flex:1;font-size:.85rem;padding:10px}
.radio{display:block;font-size:.8rem;margin:4px 0;cursor:pointer}
.radio input{margin-right:6px}

/* ===== 健康档案页 ===== */
.archive-overview .ao-row{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px;
}
.archive-overview .ao-label{font-size:.72rem;color:var(--text-3);display:block;margin-bottom:2px}
.archive-overview .ao-val{font-size:.92rem;font-weight:600}
.muted{color:var(--text-3);font-weight:400}

/* 重点问题卡片 */
.archive-issue-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.aic-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.aic-title{flex:1;font-size:.98rem;font-weight:700}
.aic-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.aic-badge{
  font-size:.68rem;background:var(--primary);color:#fff;border-radius:4px;
  padding:1px 6px;font-weight:500;margin-left:6px;vertical-align:middle;
}
.aic-section{margin-top:10px}
.aic-sub{font-size:.72rem;color:var(--text-3);font-weight:500;margin-bottom:3px}
.aic-body{font-size:.88rem;color:var(--text-2);line-height:1.6}
.aic-date{font-size:.75rem;color:var(--text-3)}
.aic-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.aic-more{display:flex;gap:8px;margin-top:8px}

/* 其他问题列表 */
.ao-list{display:flex;flex-direction:column;gap:8px}
.ao-item{
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg);
}
.ao-item-title{font-size:.9rem;font-weight:600}
.ao-item-kws{font-size:.75rem;color:var(--text-3);margin-top:3px}
.ao-item-meta{margin-top:5px;display:flex;gap:10px}

/* 时间线 */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:6px;box-shadow:0 0 0 3px #fff}
.tl-body{flex:1;min-width:0}
.tl-head{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.tl-type{font-size:.78rem;font-weight:600}
.tl-date{font-size:.72rem;color:var(--text-3);margin-left:auto}
.tl-issues{font-size:.75rem;color:var(--text-2);margin-top:2px}
.tl-desc{font-size:.85rem;color:var(--text);margin-top:2px;line-height:1.5}
.tl-val{font-size:.85rem;color:var(--primary);font-weight:600;margin-top:2px}
.tl-note{font-size:.75rem;color:var(--text-3);margin-top:2px}
.tl-actions{margin-top:4px;display:flex;gap:10px}

/* 复盘 */
.review-head{font-size:.78rem;color:var(--text-2);margin-bottom:8px}
.review-table{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rt-row{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.82rem;padding:8px 10px;border-bottom:1px solid var(--border);gap:4px}
.rt-row:last-child{border-bottom:none}
.rt-head{background:var(--bg);font-weight:600;color:var(--text-2);font-size:.78rem}

/* 小 chip */
.chip-sm{font-size:.7rem;padding:2px 8px;margin:2px}

/* ===== 女性养生 28 天：新增组件 ===== */
/* 今日感受横幅 */
.feel-banner{
  background:linear-gradient(135deg,#ff6b35 0%,#ff9166 100%);
  color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
}
.feel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.feel-title{font-size:.95rem;font-weight:600}
.feel-date{font-size:.75rem;opacity:.85}
.feel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.feel-row:last-child{margin-bottom:0}
.feel-label{width:62px;flex-shrink:0;font-size:.78rem;opacity:.9}
.feel-opts{display:flex;gap:6px;flex:1}
.feel-emoji{
  flex:1;text-align:center;font-size:1.25rem;line-height:1.2;padding:6px 0;border-radius:8px;
  background:rgba(255,255,255,.18);cursor:pointer;filter:grayscale(1);opacity:.5;transition:all .15s;
}
.feel-emoji.on{background:#fff;filter:none;opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.feel-emoji.locked{cursor:default}
.feel-actions{display:flex;justify-content:flex-end;margin-top:10px}
.feel-btn{
  border:none;background:#fff;color:var(--primary);font-weight:600;font-size:.82rem;
  padding:7px 16px;border-radius:16px;cursor:pointer;font-family:inherit;
}
.feel-btn.ghost{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.6)}
.feel-note{font-size:.72rem;opacity:.85;margin-top:8px}

/* 阶段标签 */
.phase-tag{
  display:inline-block;font-size:.72rem;background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:1px 8px;margin-left:4px;
}

/* 每日小任务卡 */
.task-card{
  background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:var(--radius);padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow);
}
.task-head{font-size:.78rem;color:var(--primary);font-weight:600;margin-bottom:4px}
.task-body{font-size:.95rem;font-weight:600;line-height:1.5}
.task-note{font-size:.78rem;color:var(--text-2);margin-top:6px;line-height:1.65}

/* 基础体温框 */
.temp-box{
  background:var(--primary-light);border:1px solid #ffd9c7;border-radius:10px;
  padding:12px;margin-top:10px;
}
.temp-title{font-size:.82rem;font-weight:600;color:var(--primary);margin-bottom:8px}

/* 体质选择 */
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.type-card{
  border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;
  background:var(--card);transition:all .15s;
}
.type-card.on{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 1px var(--primary) inset}
.type-card .t-emoji{font-size:1.2rem}
.type-card .t-name{font-size:.85rem;font-weight:600;margin-top:2px}
.type-card .t-desc{font-size:.72rem;color:var(--text-3);margin-top:4px;line-height:1.5}
.type-detail{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.type-detail .td-row{font-size:.8rem;color:var(--text-2);line-height:1.7;margin-top:4px}
.type-detail .td-row b{color:var(--text)}
.type-detail .td-red{color:#b91c1c;font-weight:500}

/* 28 天阶段时间线（完整可视化） */
.cycle-timeline-wrap{padding:4px 0}
.cycle-timeline{position:relative;padding-left:62px}
.cycle-timeline::before{
  content:'';position:absolute;left:23px;top:18px;bottom:18px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,#dc2626,#16a34a,#d97706,#0ea5e9,#f97316,#9333ea);
}
.cycle-stage{position:relative;margin-bottom:20px}
.cycle-stage:last-child{margin-bottom:0}
.cycle-stage-node{position:absolute;left:-62px;width:50px;display:flex;flex-direction:column;align-items:center}
.cycle-node-dot{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;border:3px solid var(--card);box-shadow:0 0 0 3px currentColor;z-index:2;flex-shrink:0;
}
.cycle-node-dot.fire{color:#dc2626;background:#fef2f2}
.cycle-node-dot.wrap{color:#16a34a;background:#f0fdf4}
.cycle-node-dot.blood{color:#d97706;background:#fef3c7}
.cycle-node-dot.energy{color:#0ea5e9;background:#f0f9ff}
.cycle-node-dot.prep{color:#f97316;background:#fff7ed}
.cycle-node-dot.guard{color:#9333ea;background:#faf5ff}
.cycle-node-label{font-size:10px;font-weight:700;margin-top:5px;color:var(--text-3);text-align:center;white-space:nowrap;line-height:1.2}
.cycle-node-date{font-size:9px;color:var(--text-3);text-align:center;margin-top:2px;white-space:nowrap}
.cycle-stage-card{
  background:var(--bg);border-radius:10px;padding:14px 16px;border:1px solid var(--border);
}
.cycle-stage.cur .cycle-stage-card{border-color:var(--primary);box-shadow:0 0 0 2px rgba(255,107,53,.15)}
.cycle-stage-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cycle-stage-days{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap}
.cycle-stage:first-of-type .cycle-stage-days{background:#fef2f2;color:#dc2626}
.cycle-stage:nth-of-type(2) .cycle-stage-days{background:#f0fdf4;color:#16a34a}
.cycle-stage:nth-of-type(3) .cycle-stage-days{background:#fef3c7;color:#d97706}
.cycle-stage:nth-of-type(4) .cycle-stage-days{background:#f0f9ff;color:#0ea5e9}
.cycle-stage:nth-of-type(5) .cycle-stage-days{background:#fff7ed;color:#f97316}
.cycle-stage:nth-of-type(6) .cycle-stage-days{background:#faf5ff;color:#9333ea}
.cycle-stage-title{font-size:14px;font-weight:700}
.cycle-stage-cur{font-size:11px;color:var(--primary);font-weight:500;margin-left:4px}
.cycle-stage-desc{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:10px}
.cycle-stage-desc strong{color:var(--text);font-weight:600}
.cycle-scenarios{display:flex;flex-direction:column;gap:7px}
.cycle-scenario-row{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border)}
.csr-time{font-size:11px;font-weight:700;color:var(--primary);white-space:nowrap;min-width:74px;flex-shrink:0;line-height:1.5}
.csr-time-range{font-size:9px;font-weight:500;color:var(--text-3);font-weight:normal}
.csr-scene{font-size:12px;flex-shrink:0;margin-top:1px}
.csr-text{font-size:12px;color:var(--text);line-height:1.6;flex:1;min-width:0}
.cycle-stage-note{font-size:11.5px;color:var(--text-3);margin-top:10px;padding:8px 12px;background:var(--bg);border-radius:8px;line-height:1.6;font-style:italic}

/* 移动端：compact timeline */
@media (max-width:480px){
  .cycle-timeline{padding-left:44px}
  .cycle-timeline::before{left:15px;width:2px}
  .cycle-stage-node{left:-44px;width:38px}
  .cycle-node-dot{width:32px;height:32px;font-size:14px;box-shadow:0 0 0 2.5px currentColor;border-width:2px}
  .cycle-node-label{font-size:9px}
  .cycle-node-date{display:none}
  .cycle-stage-card{padding:12px}
  .cycle-scenario-row{padding:7px 10px;gap:6px}
  .csr-time{min-width:58px;font-size:10.5px}
  .csr-text{font-size:11.5px}
}

/* 备选池 */
.pool-cat{font-size:.78rem;font-weight:600;color:var(--text-2);margin:10px 0 4px}
.pool-item{
  display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-2);
  padding:7px 10px;background:var(--bg);border-radius:8px;margin-bottom:5px;
}
.pool-item .p-box{
  width:16px;height:16px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;cursor:pointer;
}
.pool-item.on .p-box{background:var(--primary);border-color:var(--primary)}
.pool-item.on{background:var(--primary-light);color:var(--text)}
.pool-hint{font-size:.72rem;color:var(--text-3);margin-top:8px;line-height:1.6}

/* 阶段内场景行 */
.scene-row{display:flex;gap:8px;font-size:.78rem;color:var(--text-2);padding:5px 0;line-height:1.6}
.scene-row .sc-time{flex-shrink:0;color:var(--primary);font-weight:600;min-width:74px}

/* 小屏兜底：窄屏下并排输入框改为换行堆叠，避免横向溢出 */
@media (max-width:400px){
  .field-row{flex-wrap:wrap}
  .field-row .field{flex:1 1 100%}
  .scene-row{flex-direction:column;gap:0}
  .scene-row .sc-time{min-width:0}
}

/* ===== 28 天逐日清单 ===== */
.drawer-note{font-size:.72rem;color:var(--text-3);line-height:1.6;margin:-4px 0 10px}
.day-list{display:flex;flex-direction:column;gap:6px}
.day-item{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:background .15s,border-color .15s;
}
.day-item:active{background:var(--primary-light)}
.day-item.today{border-color:var(--primary);background:var(--primary-light)}
.di-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.di-idx{font-size:.76rem;font-weight:700;color:var(--primary);white-space:nowrap}
.di-phase{font-size:.72rem;color:var(--text-2);white-space:nowrap}
.di-date{font-size:.72rem;color:var(--text-3);margin-left:auto;white-space:nowrap}
.di-task{
  font-size:.76rem;color:var(--text-2);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.day-item.done .di-task{color:var(--text-3)}

/* 复盘日提示 */
.review-note{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.link-inline{margin-left:6px;color:var(--primary);text-decoration:underline;font-weight:500;white-space:nowrap}

/* 版本角标 */
.ver-tag{
  position:fixed;right:8px;bottom:8px;z-index:60;pointer-events:none;
  font-size:.65rem;color:var(--text-3);background:rgba(255,255,255,.9);
  border:1px solid var(--border);border-radius:10px;padding:1px 7px;
}

/* ===== 身体状态测评基线 ===== */
.assess-block{margin-top:14px}
.base-sub{font-size:.72rem;color:var(--text-3);font-weight:400}
.assess-meta{font-size:.78rem;color:var(--text-2);margin-top:5px;line-height:1.6}
.assess-type{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.assess-badge{
  display:inline-block;font-size:.85rem;font-weight:600;color:var(--primary);
  background:var(--primary-light);border:1px solid #ffd9c7;border-radius:8px;padding:3px 10px;
}
.assess-sim{font-size:.72rem;color:var(--accent);background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:2px 8px}
.assess-sig-title{font-size:.78rem;font-weight:600;margin-top:10px}
.assess-sig{margin:6px 0 0;padding-left:18px;font-size:.78rem;color:var(--text-2);line-height:1.7}
.assess-sig li{margin-bottom:3px}
.assess-empty{font-size:.78rem;color:var(--text-3);line-height:1.7}

/* signal 列表（含 seekCare checkbox） */
.assess-sig-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.assess-sig-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  font-size:.78rem;color:var(--text-2);line-height:1.6;cursor:pointer;
}
.assess-sig-row input{flex-shrink:0;width:15px;height:15px;accent-color:var(--danger)}
.assess-sig-row span{flex:1;min-width:0}
.sig-seek-lbl{
  flex-shrink:0;font-size:.68rem;color:var(--danger);background:#fef2f2;
  border:1px solid #fecaca;border-radius:8px;padding:1px 7px;white-space:nowrap;
}
.assess-sig-row input:checked + .sig-seek-lbl{background:#fee2e2;font-weight:600}

/* 就诊提醒 banner */
.banner.care{background:#fef2f2;border-color:#fecaca;color:#991b1b}

/* ===== Day 28 结构化复盘 ===== */
.review-block{
  background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;
  padding:12px 14px;margin-bottom:12px;
}
.review-title{font-size:.88rem;font-weight:600;color:#9a3412;margin-bottom:4px}
.review-desc{font-size:.72rem;color:#c2410c;margin-bottom:10px;line-height:1.6}
.review-item{
  background:#fff;border:1px solid #fed7aa;border-radius:8px;
  padding:10px;margin-bottom:8px;
}
.review-sig{font-size:.8rem;font-weight:500;color:#44403c;margin-bottom:6px;line-height:1.6}
.review-rating{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:6px}
.review-rating label{
  display:flex;align-items:center;gap:4px;font-size:.75rem;color:#57534e;
  cursor:pointer;padding:3px 8px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa;
}
.review-rating input{margin:0;accent-color:#ff6b35}
.review-note-input{
  width:100%;padding:6px 10px;border:1px solid #fed7aa;border-radius:6px;
  font-size:.75rem;font-family:inherit;background:#fffbeb;
}
.review-next{margin-top:10px}
.review-next label{font-size:.75rem;font-weight:600;color:#9a3412;display:block;margin-bottom:4px}
.review-next textarea{
  width:100%;padding:8px 10px;border:1px solid #fed7aa;border-radius:8px;
  font-size:.8rem;font-family:inherit;background:#fff;resize:vertical;
}

/* 趋势页：历次复盘对比 */
.rv-entry{border-top:1px solid var(--border);padding:10px 0}
.rv-entry:first-child{border-top:none;padding-top:0}
.rv-head{font-size:.78rem;font-weight:600;color:var(--primary);margin-bottom:6px}
.rv-table{width:100%;border-collapse:collapse;font-size:.75rem}
.rv-table th{text-align:left;padding:4px 6px;background:var(--bg);color:var(--text-2);font-weight:500;border:1px solid var(--border)}
.rv-table td{padding:4px 6px;border:1px solid var(--border);color:var(--text)}
.rv-plan{font-size:.78rem;color:var(--text-2);margin-top:6px;padding:6px 10px;background:var(--primary-light);border-radius:6px}

/* ===== v5 响应式适配（手机 + 电脑双端） ===== */
/* 手机端（≤480px）：紧凑布局 + 刘海屏安全区 */
@media (max-width:480px){
  body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .topbar-inner{padding:8px 12px 0}
  .brand{font-size:1rem;margin-bottom:6px;letter-spacing:.3px}
  .tab{font-size:.88rem;padding:8px 0 9px}
  main{padding:12px 14px}
  .card{padding:14px}
  .day-hero{padding:16px 14px}
  .hero-stats{gap:12px}
  .feel-banner{padding:12px 14px}
  .toast{bottom:calc(60px + env(safe-area-inset-bottom))}
  .modal-mask{padding:14px}
  .modal{max-height:90vh}
}

/* 平板/桌面端（≥769px）：宽屏布局，顶栏横排 + 容器加宽 */
@media (min-width:769px){
  .topbar-inner{
    max-width:880px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .brand{margin-bottom:0;font-size:1.08rem;white-space:nowrap}
  .tabs{gap:8px}
  .tab{flex:none;padding:16px 16px 13px;font-size:.95rem}
  main{max-width:880px;padding:20px 24px 48px}
  .card{padding:18px 20px}
  .day-hero{padding:20px 22px}
  .task-card{padding:15px 18px}
  /* 桌面端主按钮不再通栏，居中限宽 */
  .btn{max-width:420px;margin-left:auto;margin-right:auto}
  .btn-row .btn,.modal-btns .btn{max-width:none}
  .day-hero .day-focus{font-size:1.15rem}
  .stat-cell .v{font-size:1.3rem}
}

/* 大屏（≥1200px）：容器再放宽一档 */
@media (min-width:1200px){
  .topbar-inner,main{max-width:960px}
}

/* 桌面端悬停反馈（仅支持 hover 的设备生效，不影响手机触控） */
@media (hover:hover){
  .tab:hover{color:var(--primary)}
  .day-item:hover{background:var(--primary-light);border-color:#ffd9c7}
  .plan-item.editable:hover{background:var(--primary-light)}
  .type-card:hover{border-color:#ffd9c7}
  .chip:hover{background:#ffe3d6}
  .btn:hover{background:var(--primary-dark)}
  .btn.secondary:hover{background:#ffe3d6}
  .btn.ghost:hover{background:var(--bg)}
  .btn.danger:hover{background:#fef2f2}
  .nav-arrow:hover:not(:disabled){background:#ffe3d6}
  .pool-item:hover{background:var(--primary-light)}
}

/* ===== v6 电脑端专属 UI（≥1024px：左侧导航栏 + 多栏内容布局） ===== */
/* 双栏容器：手机端 display:contents 完全透明，桌面端变成两列网格 */
.dg{display:contents}
.tab-ico{margin-right:5px}
@media (max-width:480px){
  .tab-ico{display:none}
}

@media (min-width:1024px){
  /* 左侧固定导航栏 */
  body{padding-left:216px}
  .topbar{
    position:fixed;left:0;top:0;bottom:0;width:216px;
    border-bottom:none;border-right:1px solid var(--border);box-shadow:none;
  }
  .topbar-inner{
    max-width:none;height:100%;padding:24px 14px;
    flex-direction:column;align-items:stretch;justify-content:flex-start;gap:20px;
  }
  .brand{font-size:1.05rem;line-height:1.5;white-space:normal;padding:0 8px}
  .tabs{flex-direction:column;gap:6px}
  .tab{
    flex:none;text-align:left;padding:12px 14px;
    border-bottom:none;border-radius:10px;color:var(--text-2);
  }
  .tab.active{background:var(--primary-light);border-bottom:none;color:var(--primary)}
  /* 内容区：占据侧栏右侧全部宽度 */
  main{max-width:1120px;margin:0 auto;padding:26px 32px 56px}

  var bl=db.baseline;
  if(!bl.tempBase || typeof bl.tempBase!=='object') bl.tempBase={ value:'', date:null, source:'', note:'' };

  if(!bl.wakeTime) bl.wakeTime='07:00';

  if(bl.assessment){

    bl.assessment.signals = bl.assessment.signals.map(function(s){
      if(typeof s==='string') return {text:s, seekCare:false};
      if(typeof s==='object' && s!=null) return {text:s.text||'', seekCare:!!s.seekCare};
      return {text:'', seekCare:false};
    });
  }
  db.days = db.days || {};
  Object.keys(db.days).forEach(function(ds){
    var d=db.days[ds]; if(!d||typeof d!=='object'){ delete db.days[ds]; return; }
    ['warmBelly','noCold','earlySleep','bodyFood','soothing'].forEach(function(k){
      if(d[k]===undefined) delete d[k];
      else d[k] = (d[k]===true) ? true : (d[k]===false ? false : undefined);
    });
    if(!d.skipped || typeof d.skipped!=='object') d.skipped={};
    ['moxaMin','footMin','waterMl','tempC','did','tomorrow','note','submitTime','draftSavedAt'].forEach(function(k){
      if(d[k]===undefined || d[k]===null) d[k]='';

    d.done = d.done===true ? true : undefined;
    d.mode = d.mode||undefined;
  });
  if(!db.weeks || typeof db.weeks!=='object') db.weeks={};
  if(!db.reviews || !Array.isArray(db.reviews)) db.reviews=[];
  if(!db.baseline) db.baseline=blankBase();
  return db;
}

function cycleLen(){ return DB.settings.cycleLen || DEFAULT_LEN; }
function cycleStart(){ return DB.settings.cycleStart || todayStr(); }
function cycleTotal(){ return cycleLen(); }
function dayIndex(ds){ return Math.round((parseD(ds)-parseD(cycleStart()))/86400000)+1; }
function dateOfIdx(idx){ return addDays(cycleStart(), idx-1); }
function cycleLabel(){
  var s=parseD(cycleStart()), e=parseD(dateOfIdx(cycleTotal()));
  return s.getFullYear()+'年'+(s.getMonth()+1)+'月'+s.getDate()+'日至'+(e.getMonth()+1)+'月'+e.getDate()+'日';
}
function phaseOf(idx){
  var len=cycleTotal();
  if(idx<1 || idx>len) return null;
  if(idx<=2) return PHASE_MAP.fire;
  if(idx<=5) return PHASE_MAP.wrap;
  if(idx<=10) return PHASE_MAP.blood;
  if(idx<=14) return PHASE_MAP.energy;
  if(idx < len-6) return PHASE_MAP.prep;
  return PHASE_MAP.guard;
}

/* 测评类型 key → 打卡工具体质 key */
var ASSESS_KEY_MAP={
  cold_freeze:'cold', pressure_block:'pressure', heater_insufficient:'warm',
  battery_low:'battery', deep_reserve:'reserve', stuffy_damp:'damp'
};
/* 解析测评页「复制结果码」的文本（W28-ASSESS-V1） */
function parseAssessCode(text){
  var t=String(text||'').replace(/\r/g,'');
  if(t.indexOf('W28-ASSESS-V1')<0) return null;
  function pick(re){ var m=t.match(re); return m?m[1].trim():''; }
  var assessTime=pick(/测评时间：(.*)/);
  var nameLine=pick(/经期反应类型：(.*)/);
  if(!nameLine) return null;
  var primaryKey=(nameLine.match(/（([a-z_]+)）/)||[])[1]||'';
  var primaryName=nameLine.replace(/（[a-z_]+）/,'').trim();
  var similarity=pick(/匹配度：(.*)/);
  var secondary=pick(/次要倾向：(.*)/);
  var safetyLevel=pick(/安全级别：(.*)/);
  var sigBlock=(t.split('识别到的信号：')[1]||'');
  var signals=sigBlock.split('\n').map(function(s){ return s.replace(/^[-•]\s*/,'').trim(); }).filter(Boolean);
  return {
    assessTime:assessTime||'', primaryKey:primaryKey, primaryName:primaryName,
    similarity:similarity, secondary:secondary, safetyLevel:safetyLevel,
    signals:signals, importedAt:new Date().toLocaleString('zh-CN',{hour12:false})
  };
}
/* 生成测评基线文档文本 */
function buildAssessDoc(){
  var as=DB.baseline.assessment; if(!as) return '';
  var L=[];
  L.push('女性养生 28 天 · 身体状态测评基线');

  L.push('测评时间：'+(as.assessTime||'—'));
  L.push('导入时间：'+(as.importedAt||'—'));
  L.push('经期反应类型：'+(as.primaryName||'—')+(as.similarity?('（'+as.similarity+'）'):''));
  if(as.secondary) L.push('次要倾向：'+as.secondary);
  if(as.safetyLevel) L.push('安全级别：'+as.safetyLevel);
  if(as.signals&&as.signals.length){
    L.push('');
    L.push('测评中识别到的问题（基线参考）：');
    as.signals.forEach(function(s,i){ L.push((i+1)+'. '+s); });
  }
  L.push('');
  L.push('说明：以上内容来自《身体状态测评》结果，仅作为打卡期间的基线参考，不替代专业医疗医嘱。');
  return L.join('\n');
}
function downloadText(filename, text){
  var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },0);
}

var undoStack = {};

function weekOfIdx(idx){ return Math.floor((idx-1)/7)+1; }
function weekRange(w){ return [ dateOfIdx((w-1)*7+1), dateOfIdx(Math.min(w*7, cycleTotal())) ]; }
function currentWeek(){
  var idx=dayIndex(todayStr()), tot=cycleTotal();
  if(idx<1) return 1;
  if(idx>tot) return Math.ceil(tot/7);
  return weekOfIdx(idx);
}
/* 已打卡 = 提交了记录（唯一日期计数，重复提交不增加） */
function submittedDates(){ return Object.keys(DB.days).filter(function(ds){ return isSubmitted(DB.days[ds]); }); }
function weekSubmittedDays(w){
  var tot=cycleTotal();
  return submittedDates().filter(function(ds){ var i=dayIndex(ds); return i>=1 && i<=tot && weekOfIdx(i)===w; }).length;
}
function streak(){
  var s=0, d=todayStr();
  if(dayIndex(d)<1) return 0;
  if(!isSubmitted(DB.days[d])) d=addDays(d,-1);
  while(DB.days[d] && isSubmitted(DB.days[d])){ s++; d=addDays(d,-1); }
  return s;
}
function dayModeKeys(d){ return (d.mode==='busy') ? BUSY_KEYS : STD_KEYS; }
/* 当日模式目标完成：该模式全部项目都达到完成 / 已记录 */
function dayTargetFull(d){
  var keys=dayModeKeys(d);
  return keys.every(function(k){
    var it=ITEM_MAP[k];
    if(!it) return true;
    if(it.type==='num') return hasNum(d[k]);
    return d[k]===true;
  });
}
function modeFullDays(){
  var tot=cycleTotal();
  return Object.keys(DB.days).filter(function(ds){
    var d=DB.days[ds], i=dayIndex(ds);
    if(i<1||i>tot) return false;
    return dayHasContent(d) && dayTargetFull(d);
  }).length;
}

      + actionTri(t,'soothing','舒缓体式 / 放松','可选，可今日跳过',locked,true)
      + actionNum(t,'moxaMin','艾灸时长','分钟','例如 15',locked,'quick-moxa')
      + actionNum(t,'footMin','泡脚时长','分钟','例如 15',locked,'quick-foot')
      + '</details>';
  }
  html += '</div>';

  /* 7. 今日数值 + 基础体温 */
  html += '<div class="card"><div class="card-title">今日数值 <span class="sub">空着代表未记录，不算 0</span></div>';
  html += '<div class="num-summary" id="num-summary">'+numSummary(d)+'</div>';
  html += '<div class="chart-note" style="text-align:left">艾灸 / 泡脚时长在「今日行动」里填写，可用快捷按钮累加。</div>';
  html += '<div class="temp-box"><div class="temp-title">🌡️ 基础体温（晨起，可留空）</div>'
    + '<div class="field input-suffix" style="margin-bottom:6px"><input type="number" step="0.1"'+(locked?' disabled':'')+' id="q-tempC" value="'+esc(d.tempC)+'" placeholder="例如 36.5"><span class="suffix">℃</span></div>'
    + '<div class="chart-note" style="text-align:left">'+esc(TIPS.tempC)+'</div>'
    + (DB.baseline.tempBase.value?('<div class="base-cur">体温基线 '+esc(DB.baseline.tempBase.value)+' ℃ · '+esc(baseMeta(DB.baseline.tempBase))+'（基线不计入趋势样本）</div>'):'')
    + '</div>';
  html += '</div>';
  html += '</div>';

  /* 8. 反思记录（折叠） */
  html += '<details class="fold card" id="fold-extra2"'+(uiState.more?' open':'')+'><summary>反思记录 <span class="fold-sub">可不填</span></summary>'
    + '<div class="field"><label>今天我做到了</label><textarea'+(locked?' disabled':'')+' id="f-did" placeholder="一两句话">'+esc(d.did)+'</textarea></div>'
    + '<div class="field"><label>明天最重要的一件事</label><textarea'+(locked?' disabled':'')+' id="f-tomorrow" placeholder="一句话">'+esc(d.tomorrow)+'</textarea></div>'
    + '<div class="field"><label>备注 / 复盘</label><textarea'+(locked?' disabled':'')+' id="f-note" placeholder="复盘日写在这里">'+esc(d.note)+'</textarea></div>'
    + '</details>';

  /* 9. 保存与提交 */
  html += '<div class="save-area">';
  html += '<div class="save-status '+saveStateClass(d,submitted,t,isToday)+'" id="save-status">'+saveStatusText(d,submitted,t,isToday)+'</div>';
  if(future){
    html += '<div class="chart-note">未来日期不可提交</div>';
  } else if(locked){
    html += '<button class="btn secondary" id="btn-edit">修改</button>';
  } else {
    var mainLabel = isToday ? (submitted?'保存修改':'完成今日打卡') : (submitted?'保存修改':'补记打卡');
    html += '<div class="btn-row">'
      + '<button class="btn secondary" id="btn-draft">保存草稿</button>'
      + '<button class="btn" id="btn-submit">'+mainLabel+'</button>'
      + '</div>';
  }
  html += '</div>';
  html += '<div class="notice">数据保存在当前浏览器，换设备或清理浏览器前请导出备份。「已打卡」只表示提交了记录，不等于全部完成。</div>';
  html += '<div class="notice red">⚠️ '+esc(SAFETY)+'</div>';

  el.innerHTML=html;
  bindToday(el,d,t);
  bindFolds(el);
}

function feelRow(kind,label,emojis,txts,cur,locked){
  return '<div class="feel-row"><div class="feel-label">'+esc(label)+'</div><div class="feel-opts">'
    + emojis.map(function(e,i){
        var on = (hasNum(cur) && parseInt(cur,10)===(i+1)) ? ' on':'';
        return '<div class="feel-emoji'+on+(locked?' locked':'')+'"'+(locked?'':' data-feel="'+kind+'" data-val="'+(i+1)+'"')+' title="'+esc(txts[i])+'">'+e+'</div>';
      }).join('')
    + '</div></div>';
}

/* 三态行动行 */
function actionTri(dateStr,key,label,hint,locked,optional){
  var d=getDay(dateStr), s=triOf(d,key);
  var skipped = d.skipped && d.skipped[key];
  var boxCls='box'+(s==='yes'?' on':(s==='no'?' off':(skipped?' skip':'')));
  var boxTxt=s==='yes'?'✓':(s==='no'?'✕':(skipped?'—':''));
  return '<div class="check-row'+(locked?' locked':'')+'">'
    + '<div class="'+boxCls+'"'+(locked?'':' data-tri="'+key+'"')+'>'+boxTxt+'</div>'
    + '<div class="label">'+esc(label)
    + (hint?'<div class="hint">'+esc(hint)+'</div>':'')
    + triLegend(key,optional,locked)
    + tipBlock(key,dateStr,locked)
    + '</div></div>';
}
function triLegend(key,optional,locked){
  if(locked) return '';
  var d0=getDay(viewDate);
  var skipped=d0.skipped&&d0.skipped[key];
  var lg='<div class="tri-hint">连点方框切换：未记录 → 完成 → 未完成'
    + (skipped?' <b style="color:var(--primary)">已跳过</b>':'')+'</div>';
  if(optional) lg += '<button class="link-btn" data-skip="'+key+'">'+(skipped?'取消跳过':'今日跳过')+'</button>';
  return lg;
}
/* 数值型行动行 */
function actionNum(dateStr,key,label,unit,ph,locked,extra){
  var d=getDay(dateStr), v=d[key];
  var s='<div class="num-state'+(hasNum(v)?' ok':'')+'">'+(hasNum(v)?('已记录 '+esc(v)+' '+unit):'未记录')+'</div>';
  return '<div class="num-row'+(locked?' locked':'')+'">'
    + '<div class="num-head"><div class="num-label">'+esc(label)+'</div><div class="num-input">'
    + '<input type="number"'+(locked?' disabled':'')+' id="q-'+key+'" value="'+esc(v)+'" placeholder="'+esc(ph)+'"><span class="unit">'+esc(unit)+'</span>'
    + '</div></div>'
    + s + quickRowExtra(key,extra,locked) + tipBlock(key,dateStr,locked) + '</div>';
}
function quickRowExtra(key,extra,locked){
  if(locked) return '';
  var map={ 'quick-moxa':['moxa',[['5','＋5分钟'],['10','＋10分钟']]],
            'quick-foot':['foot',[['5','＋5分钟'],['10','＋10分钟']]],
            'quick-water':['water',[['200','＋200毫升'],['300','＋300毫升']]] };
  var cfg=map[extra]; if(!cfg) return '';
  var kind=cfg[0];
  var stack=(undoStack[viewDate]&&undoStack[viewDate][kind])||[];
  return '<div class="chip-row">'
    + cfg[1].map(function(p){ return '<button class="chip" data-add="'+kind+'" data-val="'+p[0]+'">'+p[1]+'</button>'; }).join('')
    + '<button class="chip undo" id="undo-'+kind+'" '+(stack.length?'':'disabled')+'>撤销</button></div>';
}
function tipBlock(key,dateStr,locked){
  var body = TIPS[key] ? '<div class="tip-body">'+esc(TIPS[key])+'</div>' : '';
  if(key==='bodyFood' && DB.settings.type && TYPE_MAP[DB.settings.type]){
    var ty=TYPE_MAP[DB.settings.type];
    body += '<div class="tip-body"><b>你选的体质：'+esc(ty.name)+'</b><br>茶饮 / 食疗：'+esc(ty.tea)+'<br>穴位 / 艾灸：'+esc(ty.point)
      + '<br>红灯：<span style="color:#b91c1c">'+esc(ty.red)+'</span></div>';
  }
  if(!body) return '';
  return '<details class="tips"><summary>查看方法</summary>'+body+'</details>';
}
function numSummary(d){
  var parts=[];
  parts.push('<div class="ns-item'+(hasNum(d.footMin)?' ok':'')+'">泡脚 <b>'+(hasNum(d.footMin)?esc(d.footMin)+' 分钟':'未记录')+'</b></div>');
  parts.push('<div class="ns-item'+(hasNum(d.moxaMin)?' ok':'')+'">艾灸 <b>'+(hasNum(d.moxaMin)?esc(d.moxaMin)+' 分钟':'未记录')+'</b></div>');
  parts.push('<div class="ns-item'+(hasNum(d.waterMl)?' ok':'')+'">饮水 <b>'+(hasNum(d.waterMl)?esc(d.waterMl)+' 毫升':'未记录')+'</b></div>');
  parts.push('<div class="ns-item'+(hasNum(d.tempC)?' ok':'')+'">体温 <b>'+(hasNum(d.tempC)?esc(d.tempC)+' ℃':'未记录')+'</b></div>');
  return parts.join('');
}

function saveStateClass(d,submitted,t,isToday){
  if(saveState.status==='failed') return 'failed';
  if(submitted) return 'ok';
  if(d.draftSavedAt) return 'saved';
  return '';
}
function saveStatusText(d,submitted,t,isToday){
  if(saveState.status==='failed') return '保存失败，请重试。';
  if(saveState.status==='saving') return '正在保存……';
  if(submitted) return (isToday?'今日已打卡':'该日已打卡')+(d.submitTime?' · '+d.submitTime:'');
  if(d.draftSavedAt) return '草稿已保存 · '+d.draftSavedAt;
  return '尚未记录';
}

/* 把表单内容写入记录（不含提交标记） */
function collectFields(el,d){
  ['q-moxaMin:moxaMin','q-footMin:footMin','q-waterMl:waterMl','q-tempC:tempC',
   'f-did:did','f-tomorrow:tomorrow','f-note:note'].forEach(function(pair){
    var p=pair.split(':'), f=$('#'+p[0],el);
    if(f) d[p[1]]=f.value;
  });
}
function bindFolds(el){
  $$('details.fold',el).forEach(function(dt){
    dt.addEventListener('toggle', function(){
      if(dt.id==='fold-extra') uiState.extra=dt.open;
      else if(dt.id==='fold-extra2') uiState.more=dt.open;
    });
  });
}
function bindToday(el,d,t){
  var today=todayStr(), future=(t>today);
  function flushDraft(){
    collectFields(el,d);
    d.draftSavedAt=hhmm(new Date());
    var ok=save(); updateSaveLine(el,t); return ok;
  }
  function updateSaveLine(el,t){
    var node=$('#save-status',el); if(!node) return;
    var dd=getDay(t), sub=isSubmitted(dd);
    node.textContent=saveStatusText(dd,sub,t,t===todayStr());
    node.className='save-status '+saveStateClass(dd,sub,t,t===todayStr());
  }
  /* 日期切换 */
  var prev=$('#nav-prev',el), next=$('#nav-next',el), back=$('#nav-back-today',el);
  if(prev) prev.addEventListener('click',function(){ viewDate=addDays(viewDate,-1); editing=false; uiState.feelEdit=false; renderToday(); window.scrollTo(0,0); });
  if(next) next.addEventListener('click',function(){ viewDate=addDays(viewDate,1); editing=false; uiState.feelEdit=false; renderToday(); window.scrollTo(0,0); });
  if(back) back.addEventListener('click',function(){ viewDate=todayStr(); editing=false; uiState.feelEdit=false; renderToday(); window.scrollTo(0,0); });

  if(future) return;

  d = ensureDay(t);

  /* 感受选择 */
  $$('[data-feel]',el).forEach(function(emo){
    emo.addEventListener('click',function(){
      var kind=emo.getAttribute('data-feel'), val=parseInt(emo.getAttribute('data-val'),10);
      d[kind]=val;
      d.draftSavedAt=hhmm(new Date());
      save(); renderToday();
    });
  });
  var bs=$('#btn-feel-submit',el);
  if(bs) bs.addEventListener('click',function(){
    if(!(hasNum(d.body)&&hasNum(d.mind))){ toast('身体感受和心情感受都要选一项'); return; }
    d.feelSubmitted=true; uiState.feelEdit=false;
    d.draftSavedAt=hhmm(new Date());
    save(); renderToday(); toast('今日感受已提交 ✓');
  });
  var be=$('#btn-feel-edit',el);
  if(be) be.addEventListener('click',function(){ uiState.feelEdit=true; renderToday(); });

  /* 模式切换 */
  $$('[data-mode]',el).forEach(function(b){
    b.addEventListener('click',function(){
      collectFields(el,d);
      var m=b.getAttribute('data-mode');
      if(m==='standard') delete d.mode; else d.mode=m;
      save(); renderToday();
    });
  });
  /* 三态勾选 */
  $$('[data-tri]',el).forEach(function(box){
    box.addEventListener('click',function(){
      collectFields(el,d);
      var k=box.getAttribute('data-tri'), cur=triOf(d,k);
      if(d.skipped && d.skipped[k]) delete d.skipped[k];
      if(cur==='unknown') d[k]=true; else if(cur==='yes') d[k]=false; else delete d[k];
      if(d[k]===undefined) delete d[k];
      save(); renderToday();
    });
  });
  /* 今日跳过 */
  $$('[data-skip]',el).forEach(function(b){
    b.addEventListener('click',function(){
      collectFields(el,d);
      var k=b.getAttribute('data-skip');
      d.skipped=d.skipped||{};
      if(d.skipped[k]) delete d.skipped[k]; else { d.skipped[k]=true; delete d[k]; }
      save(); renderToday();
    });
  });
  /* 快捷累加 */
  $$('[data-add]',el).forEach(function(b){
    b.addEventListener('click',function(){
      collectFields(el,d);
      var kind=b.getAttribute('data-add'), val=parseFloat(b.getAttribute('data-val'));
      undoStack[t]=undoStack[t]||{water:[],moxa:[],foot:[]};
      var field = kind==='water'?'waterMl':(kind==='moxa'?'moxaMin':'footMin');
      d[field]=String((num(d[field])||0)+val);
      undoStack[t][kind]=(undoStack[t][kind]||[]).concat([val]);
      d.draftSavedAt=hhmm(new Date());
      save(); renderToday();
    });
  });
  ['water','moxa','foot'].forEach(function(kind){
    var u=$('#undo-'+kind,el); if(!u) return;
    u.addEventListener('click',function(){
      collectFields(el,d);
      var stack=(undoStack[t]&&undoStack[t][kind])||[];
      if(!stack.length) return;
      var val=stack.pop();
      var field = kind==='water'?'waterMl':(kind==='moxa'?'moxaMin':'footMin');
      var nv=Math.max(0,(num(d[field])||0)-val);
      d[field] = (nv===0 && stack.length===0) ? '' : String(nv);
      undoStack[t][kind]=stack;
      d.draftSavedAt=hhmm(new Date());
      save(); renderToday();
    });
  });
  /* 数值输入自动存草稿 */
  var timer=null;
  $$('#q-moxaMin,#q-footMin,#q-waterMl,#q-tempC,#f-did,#f-tomorrow,#f-note',el).forEach(function(f){
    f.addEventListener('input',function(){
      var node=$('#save-status',el); if(node){ node.textContent='正在保存……'; node.className='save-status'; }
      clearTimeout(timer);
      timer=setTimeout(function(){ if(flushDraft()) syncNumStates(el,d); },600);
    });
  });

  var btnDraft=$('#btn-draft',el);
  if(btnDraft) btnDraft.addEventListener('click',function(){
    if(flushDraft()) toast('草稿已保存 · '+d.draftSavedAt); else toast('保存失败，请重试');
  });
  var btnSubmit=$('#btn-submit',el);
  if(btnSubmit) btnSubmit.addEventListener('click',function(){
    collectFields(el,d);
    var now=new Date();
    d.done=true;
    d.submitTime=pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+hhmm(now);
    d.draftSavedAt=hhmm(now);
    editing=false;
    if(!save()){ updateSaveLine(el,t); toast('保存失败，请重试'); return; }
    renderAll();
    toast(t===today?'已提交打卡数据 ✓':'已保存 ✓');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  var btnEdit=$('#btn-edit',el);
  if(btnEdit) btnEdit.addEventListener('click',function(){
    editing=true; renderToday();
    var c=el.querySelector('.mode-switch'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'});
  });
  /* 就诊提醒：按天关闭（明天会重新弹） */
  var btnCare=$('#btn-dismiss-care',el);
  if(btnCare) btnCare.addEventListener('click',function(){
    DB.settings.dismissedCareAt=todayStr(); save(); renderToday();
  });
  $$('[data-dismiss-backup]',el).forEach(function(b){
    b.addEventListener('click',function(){
      var w=b.getAttribute('data-dismiss-backup');
      DB.settings.dismissedBackup=DB.settings.dismissedBackup||[];
      if(DB.settings.dismissedBackup.indexOf(w)<0) DB.settings.dismissedBackup.push(w);
      save(); renderToday();
    });
  });
  var goReview=$('#go-review',el);
  if(goReview) goReview.addEventListener('click',function(){
    var fd=$('#fold-extra2',el);
    if(fd){
      fd.open=true; uiState.more=true;
      if(typeof fd.scrollIntoView==='function') fd.scrollIntoView({behavior:'smooth',block:'center'});
      var ta=$('#f-note',el);
      if(ta && typeof ta.focus==='function') ta.focus();
    }
  });
  /* Day 28 结构化复盘保存 */
  var btnReview=$('#btn-save-review',el);
  if(btnReview) btnReview.addEventListener('click',function(){
    var signals=[];
    if(DB.baseline.assessment && DB.baseline.assessment.signals){
      signals=DB.baseline.assessment.signals.map(function(s){ return (typeof s==='object')?(s.text||''):String(s); }).filter(Boolean);
    }
    var entries=signals.map(function(s,si){
      var r=el.querySelector('input[name="rr_'+si+'"]:checked');
      var note=el.querySelector('.review-item:nth-of-type('+(si+1)+') .review-note-input');
      return { signalText:s, rating:r?r.value:'', note:note?note.value.trim():'' };
    });
    var nextPlan=($('#review-next-plan',el).value||'').trim();
    var rid='r_'+cycleStart()+'_'+todayStr();
    var idx=dayIndex(todayStr());
    var existingIdx=-1;
    DB.reviews.forEach(function(r,i){ if(r.cycleStart===cycleStart() && r.idx===idx) existingIdx=i; });
    var rev={ id:rid, cycleStart:cycleStart(), reviewDate:todayStr(), idx:idx, entries:entries, nextPlan:nextPlan, completedAt:new Date().toISOString() };
    if(existingIdx>=0) DB.reviews[existingIdx]=rev; else DB.reviews.push(rev);
    save(); renderToday(); toast('复盘已保存');
  });
}
/* 轻量同步数值状态与汇总，避免重绘打断输入 */
function syncNumStates(el,d){
  $$('.num-row',el).forEach(function(row){
    var inp=$('input',row), node=$('.num-state',row);
    if(!inp || !node) return;
    var v=inp.value, unit=(row.querySelector('.unit')||{}).textContent||'';
    node.textContent = hasNum(v) ? ('已记录 '+v+' '+unit) : '未记录';
    node.className = 'num-state'+(hasNum(v)?' ok':'');
  });
  var sum=$('#num-summary',el); if(sum) sum.innerHTML=numSummary(d);
}

/* ============ 趋势报告页 ============ */
function renderTrend(){
  var el=$('#page-trend');
  var tot=cycleTotal();
  var dates=Object.keys(DB.days).filter(function(ds){ var i=dayIndex(ds); return i>=1&&i<=tot; }).sort();

  var footSum=0,footN=0,waterSum=0,waterN=0;
  var temps=[], bodies=[], minds=[];
  dates.forEach(function(ds){
    var d=DB.days[ds];
    if(hasNum(d.footMin)){ footSum+=num(d.footMin); footN++; }
    if(hasNum(d.waterMl)){ waterSum+=num(d.waterMl); waterN++; }
    if(hasNum(d.tempC)) temps.push({x:ds,y:num(d.tempC)});
    if(hasNum(d.body)) bodies.push({x:ds,y:num(d.body)});
    if(hasNum(d.mind)) minds.push({x:ds,y:num(d.mind)});
  });
  var avgTemp = temps.length ? (temps.reduce(function(a,p){return a+p.y;},0)/temps.length) : null;
  var bt = num(DB.baseline.tempBase.value);
  var tDelta = (temps.length && bt!=null) ? (avgTemp-bt) : null;

  var html='';
  html += '<div class="stat-grid">'
    + statCell(weekSubmittedDays(currentWeek()),'本周已打卡 天','第 '+currentWeek()+' 周')
    + statCell(submittedDates().length,'累计已打卡 天','提交记录的唯一天数')
    + statCell(streak(),'连续打卡 天','次要指标')
    + statCell(modeFullDays(),'当日模式目标完成天','见下方统计口径')
    + statCell(waterN?Math.round(waterSum/waterN):'记录积累中','日均饮水 毫升',waterN?('基于 '+waterN+' 天'):'暂无记录')
    + statCell(temps.length?avgTemp.toFixed(2):'记录积累中','平均基础体温 ℃',temps.length?('基于 '+temps.length+' 天'):'暂无记录')
    + statCell(footN?(footSum/footN).toFixed(0):'记录积累中','平均泡脚 分钟',footN?('基于 '+footN+' 天'):'暂无记录')
    + statCell(tDelta!=null?((tDelta>0?'+':'')+tDelta.toFixed(2)):'记录积累中','较基线体温 ℃',(bt!=null&&tDelta!=null)?('基线 '+bt+' ℃'):'待填基线')
    + '</div>';

  html += '<div class="notice" style="margin-bottom:12px">统计口径：<b>「已打卡」只表示提交了记录，不等于全部行动完成。</b>'
    + '数字类项目（艾灸／泡脚／饮水／体温）以实际数值计入，不自动判断达标；未记录的项目不按 0 计算。'
    + '标准版与极简版分别统计，不混用同一个完成率。'
    + '「当日模式目标完成天」＝当天所选模式的各项都达到完成或已记录的天数。</div>';

  html += '<div class="dg">';

  /* 基础体温趋势 */
  html += '<div class="card"><div class="card-title">基础体温趋势 <span class="sub">只统计每日记录，基线单独列出</span></div>';
  if(temps.length<2){ html += '<div class="empty">记录积累中：至少两次晨起体温后显示趋势</div>'; }
  else { html += '<canvas class="chart" id="ch-temp"></canvas>'; }
  html += '<div class="chart-note">基线 '+(DB.baseline.tempBase.value?esc(DB.baseline.tempBase.value)+' ℃':'—')+' · '+esc(baseMeta(DB.baseline.tempBase))+'（基线不计入趋势样本）</div>'
    + '<div class="chart-note">仅按数值呈现，不判断排卵或黄体功能；体温受睡眠、测量时间影响，单点波动不必紧张。</div></div>';

function weekBlock(w){
  var rg=weekRange(w), tot=cycleTotal();
  var days=[];
  for(var i=(w-1)*7;i<Math.min(w*7,tot);i++){
    var ds=dateOfIdx(i+1);
    days.push({ds:ds, rec:DB.days[ds], idx:i+1});
  }
  var recorded=days.filter(function(x){ return dayHasContent(x.rec); });
  var submitted=days.filter(function(x){ return isSubmitted(x.rec); });
  var std=recorded.filter(function(x){ return (x.rec.mode||'standard')==='standard'; });
  var busy=recorded.filter(function(x){ return x.rec.mode==='busy'; });
  var waterSum=0,waterN=0,tempSum=0,tempN=0;
  recorded.forEach(function(x){
    if(hasNum(x.rec.waterMl)){ waterSum+=num(x.rec.waterMl); waterN++; }
    if(hasNum(x.rec.tempC)){ tempSum+=num(x.rec.tempC); tempN++; }
  });
  var html='<div class="week-block"><div class="week-head"><b>第 '+w+' 周</b> <span>'+dateLabel(rg[0])+'–'+dateLabel(rg[1])+'</span></div>';
  html += '<div class="week-days">';
  days.forEach(function(x){
    var st = isSubmitted(x.rec)?'done':(dayHasContent(x.rec)?'draft':'empty');
    var tip = st==='done'?'已打卡':(st==='draft'?'已有草稿':'未记录');
    html += '<div class="wday '+st+'" title="Day '+x.idx+'｜'+dateLabel(x.ds)+'：'+tip+'"><span>'+x.idx+'</span><i>'+dateLabel(x.ds)+'</i></div>';
  });
  html += '</div>';
  html += '<div class="week-metrics">'
    + '<div class="wm"><b>'+recorded.length+'/'+days.length+'</b><span>记录天数</span></div>'
    + '<div class="wm"><b>'+submitted.length+'</b><span>已打卡天数</span></div>'
    + '<div class="wm"><b>'+std.length+' / '+busy.length+'</b><span>标准版 / 极简版</span></div>'
    + '</div>';
  html += '<div class="week-metrics">'
    + '<div class="wm"><b>'+(waterN?Math.round(waterSum/waterN)+' 毫升':'—')+'</b><span>已记录日平均饮水'+(waterN?(' · 基于 '+waterN+' 天'):'')+'</span></div>'
    + '<div class="wm"><b>'+(tempN?(tempSum/tempN).toFixed(2)+' ℃':'—')+'</b><span>已记录日平均体温'+(tempN?(' · 基于 '+tempN+' 天'):'')+'</span></div>'
    + '</div>';
  html += '<div class="mode-cols">'+modeStatCol('标准版',std,STD_KEYS)+modeStatCol('极简版',busy,BUSY_KEYS)+'</div>';
  html += '<div class="field week-adjust"><label>下周调整（一句话）</label>'
    + '<input type="text" data-week-adjust="'+w+'" value="'+esc((DB.weeks[w]&&DB.weeks[w].adjust)||'')+'" placeholder="例如：把晚饭后的泡脚固定成 15 分钟">'
    + '</div></div>';
  return html;
}
function modeStatCol(title,list,keys){
  var html='<div class="mode-col"><div class="mode-col-title">'+title+' <span>'+list.length+' 天</span></div>';
  if(list.length===0){ html += '<div class="mode-empty">该周没有'+title+'记录</div></div>'; return html; }
  keys.forEach(function(k){
    var it=ITEM_MAP[k]; if(!it) return;
    var counts={yes:0,no:0,unknown:0,skip:0,rec:0}, sum=0, n=0;
    list.forEach(function(x){
      var d=x.rec;
      if(d.skipped && d.skipped[k]){ counts.skip++; return; }
      if(it.type==='num'){ if(hasNum(d[k])){ counts.rec++; n++; sum+=num(d[k]); } else counts.unknown++; }
      else { var s=triOf(d,k); if(s==='yes') counts.yes++; else if(s==='no') counts.no++; else counts.unknown++; }
    });
    if(it.type==='num'){
      var detail='已记录 '+counts.rec+' 天'+(n>1?(' · 平均 '+(sum/n).toFixed(1)+' '+it.unit):(n===1?(' · 共 '+sum+' '+it.unit):''))
        + (counts.unknown?' · 未记录 '+counts.unknown+' 天':'');
      html += '<div class="ms-row"><span class="ms-name">'+esc(it.name)+'</span><span class="ms-val num">'+detail+'</span></div>';
    } else {
      var parts=[];
      if(counts.yes) parts.push('完成 '+counts.yes);
      if(counts.no) parts.push('未完成 '+counts.no);
      if(counts.unknown) parts.push('未记录 '+counts.unknown);
      if(counts.skip) parts.push('跳过 '+counts.skip);
      html += '<div class="ms-row"><span class="ms-name">'+esc(it.name)+'</span><span class="ms-val">'+(parts.join(' · ')||'—')+'</span></div>';
    }
  });
  html += '</div>';
  return html;
}

/* 简易折线图（多序列） */
function drawLine(canvas, series, unit){
  var dpr=window.devicePixelRatio||1;
  var W=canvas.clientWidth, H=180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var padL=40,padR=14,padT=14,padB=26;
  var all=[];
  series.forEach(function(s){ all=all.concat(s.points.map(function(p){return p.y;})); });
  if(!all.length) return;
  var min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  if(Math.abs(max-min)<0.001){ max+=1; min-=1; }
  var span=max-min; min-=span*0.12; max+=span*0.12;
  var xs=[];
  series.forEach(function(s){ s.points.forEach(function(p){ if(xs.indexOf(p.x)<0) xs.push(p.x); }); });
  xs.sort();
  var n=xs.length;
  function X(i){ return n===1 ? padL+(W-padL-padR)/2 : padL+(W-padL-padR)*i/(n-1); }
  function Y(v){ return padT+(H-padT-padB)*(1-(v-min)/(max-min)); }
  ctx.strokeStyle='#eee7e3'; ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.lineWidth=1;
  for(var g=0;g<=3;g++){
    var v=min+(max-min)*g/3, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(v.toFixed(1),4,y+3);
  }
  series.forEach(function(s){
    if(!s.points.length) return;
    ctx.strokeStyle=s.color; ctx.lineWidth=2; ctx.beginPath();
    s.points.forEach(function(p,i){
      var xi=X(xs.indexOf(p.x)), yi=Y(p.y);
      if(i===0) ctx.moveTo(xi,yi); else ctx.lineTo(xi,yi);
    });
    ctx.stroke();
    ctx.fillStyle=s.color;
    s.points.forEach(function(p){ ctx.beginPath(); ctx.arc(X(xs.indexOf(p.x)),Y(p.y),3,0,Math.PI*2); ctx.fill(); });
    var last=s.points[s.points.length-1];
    ctx.font='10px sans-serif';
    ctx.fillText(last.y, Math.min(X(xs.indexOf(last.x))+6, W-32), Y(last.y)-4);
  });
  ctx.fillStyle='#9ca3af'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  var step=Math.max(1,Math.ceil(n/6));
  for(var i=0;i<n;i+=step){ ctx.fillText(dateLabel(xs[i]), X(i), H-8); }
  ctx.textAlign='left';
}
