<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>30天调理打卡</title>
<link rel="stylesheet" href="styles.v37.css?v=43">
<script>
(function(){function showErr(msg,src,line){var b=document.getElementById("__errbox");if(!b){b=document.createElement("pre");b.id="__errbox";b.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#fef2f2;color:#991b1b;padding:20px;font:13px/1.5 Menlo,monospace;white-space:pre-wrap;z-index:99999;overflow:auto";document.body.appendChild(b);}b.textContent+="\n• "+msg+(src?" @ "+src+":"+line:"");}window.onerror=function(m,s,l,c,e){showErr(m,s,l);};window.addEventListener("unhandledrejection",function(e){showErr("Promise: "+e.reason);});})();
</script></head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">30天调理</div>
    <nav class="tabs">
      <button class="tab active" data-tab="today">今日</button>
      <button class="tab" data-tab="plan">计划</button>
      <button class="tab" data-tab="trend">趋势</button>
      <button class="tab" data-tab="archive">健康档案</button>
      <button class="tab" data-tab="setting">设置</button>
    </nav>
  </div>
</header>

<main id="app">
  <section id="page-today" class="page active"></section>
  <section id="page-plan" class="page"></section>
  <section id="page-trend" class="page"></section>
  <section id="page-archive" class="page"></section>
  <section id="page-setting" class="page"></section>
</main>

<div id="toast" class="toast"></div>

<!-- 浮动相机按钮 + 菜单（Phase 1：纯前端压缩存图） -->
<button class="fab-cam" id="fabCam" aria-label="拍照/上传">📷</button>
<div class="cam-menu" id="camMenu">
  <button id="camFood"><span>🍱</span>拍食物</button>
  <button id="camReport"><span>📋</span>上传报告</button>
  <button id="camGlucose"><span>🩸</span>拍血糖读数</button>
</div>
<input type="file" id="fileFood" accept="image/*" capture="environment" hidden>
<input type="file" id="fileReport" accept="image/*,application/pdf" hidden>
<input type="file" id="fileGlucose" accept="image/*" capture="environment" hidden>

<script src="app.v37.js?v=43"></script>
<script src="archive-seed.v37.js?v=43"></script>
<script src="health-archive.v37.js?v=43"></script>
<div class="ver-tag">v43</div>
</body>
</html>
