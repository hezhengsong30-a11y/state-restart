<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body>
<pre id="log"></pre>
<script>
var orig = console.error;
console.error = function(){ var pre=document.getElementById('log'); pre.textContent += 'ERR: '+Array.from(arguments).join(' ') + '\n'; orig.apply(console, arguments); };
window.onerror = function(msg,file,line){ document.getElementById('log').textContent += 'GLOBAL: '+msg+' @ '+file+':'+line+'\n'; };
</script>
